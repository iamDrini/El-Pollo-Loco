<!DOCTYPE html>
<html translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="icon" type="image/x-icon" href="/img/fav-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js"></script>
    <script src="js/models/drawable-object.class.js"></script>
    <script src="js/models/movable-object.class.js"></script>
    <script src="js/models/collactable-object.js"></script>
    <script src="js/models/character.class.js"></script>
    <script src="js/models/throwable-object.class.js"></script>
    <script src="js/models/coin.class.js"></script>
    <script src="js/models/bottle.class.js"></script>
    <script src="js/models/chicken.class.js"></script>
    <script src="js/models/cloud.class.js"></script>
    <script src="js/models/background-object.class.js"></script>
    <script src="js/models/keyboard.class.js"></script>
    <script src="js/models/level.class.js"></script>
    <script src="js/models/endboss.class.js"></script>
    <script src="js/levels/level1.js"></script>
    <script src="js/models/status-bar.class.js"></script>
    <script src="js/models/bottle-bar.class.js"></script>
    <script src="js/models/coin-bar.js"></script>
    <script src="js/models/endboss-bar.class.js"></script>
    <script src="js/models/world.class.js"></script>
    <script src="js/game.js"></script>
</head>

<body>

    <div id="rotate-overlay">
        <p>Turn your device to play</p>
    </div>

    <h1>El Pollo Loco</h1>
    <div class="canvas-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="mobile-btn-container">
            <div>
                <button id="btn-left" class="mobile-btn"><img src="img/left.png"></button>
                <button id="btn-right" class="mobile-btn"><img src="img/right.png"></button>
            </div>
            <div>
                <button id="btn-up" class="mobile-btn"><img src="img/arrow-up.png"></button>
                <button id="salsa-btn" class="mobile-btn"><img src="img/6_salsa_bottle/salsa_bottle.png"></button>
            </div>
        </div>
        <div id="start-screen" class="start-screen">
            <div class="start-screen-container">
                <button onclick="startGame()" class="start-screen-btn">
                    <span>START</span>
                </button>
                <button onclick="toggleMute(); updateMuteOverlay()" id="mute-btn" class="mute-btn">
                    <img src="img/speaker.png">
                </button>
            </div>
        </div>
        <div id="game-over-screen" class="game-over-screen">
            <img src="img/You won, you lost/Game over A.png">
            <button onclick="restartGame()">RESTART</button>
        </div>
        <div id="game-win-screen" class="game-over-screen">
            <img src="img/You won, you lost/You Win A.png">
            <button onclick="restartGame()">RESTART</button>
        </div>
        <button onclick="fullscreen()" class="fullscreen-btn">
            <img src="img/expand.png" alt="Fullscreen" />
        </button>
    </div>

    <div class="control-container">
        <div class="control-content">
            <img class="arrow-img" src="img/left.png">
            <span>walk left</span>
        </div>
        <div class="control-content">
            <img class="arrow-img" src="img/right.png">
            <span>walk right</span>
        </div>
        <div class="control-content">
            <img class="space-img" src="img/space-bar.png">
            <span>jump</span>
        </div>
        <div class="control-content">
            <span class="span-d">D</span>
            <span>throw bottle</span>
        </div>
    </div>

    <footer>
        <a href="html/impressum.html">Impressum</a>
    </footer>

</body>

</html>
